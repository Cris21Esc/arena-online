<head>
    <title>Socket Test</title>
</head>

<body>

    <h1>Socket.IO Test</h1>

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <script>

        const playerName =
                prompt('Nombre de jugador')
                || 'Jugador';

        const socket = io('http://localhost:3000');

        socket.on('connect', () => {

            console.log(
                'Connected:',
                socket.id
            );

            socket.emit(
                'join-room',
                {
                    roomId: 'arena-1',
                    playerName
                }
            );

        });

        socket.on('room-joined', (roomId) => {

            console.log(
                'Entraste en sala:',
                roomId
            );

        });

        socket.on('room-full', (roomId) => {

            console.log(
                `Sala ${roomId} llena`
            );

        });

        socket.on(
            'rooms-updated',
            (rooms) => {
                console.log(
                    'Salas:',
                    rooms
                );
            }
        );

    </script>

</body>
